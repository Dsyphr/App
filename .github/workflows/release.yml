name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci-check:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  
  build-release:
    needs: ci-check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > $GITHUB_WORKSPACE/app/google-services.json
          if [ ! -f "$GITHUB_WORKSPACE/app/google-services.json" ]; then
            echo "Error: google-services.json file was not created"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$GITHUB_WORKSPACE/app/google-services.json'))" 2>/dev/null; then
            echo "Error: google-services.json is not valid JSON"
            exit 1
          fi
          echo "google-services.json validated successfully"
      
      - name: Build Release APK
        run: ./gradlew assembleRelease
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
