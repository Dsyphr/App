config:
  maxProblemPerRule: 10
  excludes: '**/build/**,**/.gradle/**'
  validation: false

processors:
  active: true
  project:
    excludes: '**/build/**,**/.gradle/**'

console-reports:
  active: true
  checks:
    - active: true
  project:
    - active: true
  progress:
    - active: false

output-reports:
  active: true
  path: build/reports/detekt.xml
  type: XML

rules:
  active: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: "_"
  WildcardImport:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    ignoreComments: true
  ReturnCount:
    active: true
    max: 5
  FunctionNaming:
    active: false
  ClassNaming:
    active: true
  MagicNumber:
    active: false
  NamingConvention:
    active: true
  ForbiddenComment:
    active: false
  ForbiddenVoid:
    active: true
  SafeCast:
    active: true
  ThrowsCount:
    active: true
    max: 3
  TrailingWhitespace:
    active: true
  UnnecessaryAbstractClass:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedVariable:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  UseCheckOrError:
    active: false
  NewLineAtEndOfFile:
    active: false

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 5
  NestedBlockDepth:
    active: true
    max: 4
  TooManyFunctions:
    active: true
    maxFunctions: 11
  ModifierOrder:
    active: true
  ModifierMissing:
    active: true
  FunctionNaming:
    active: false

  complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    threshold: 7
  LargeClass:
    active: true
    threshold: 60

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ["Composable"]
  PackageName:
    active: true

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
